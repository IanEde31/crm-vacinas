  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f7fa;
    color: #1a202c;
    padding: 32px 24px;
    line-height: 1.5;
  }
  header {
    max-width: 1200px;
    margin: 0 auto 24px;
  }
  h1 {
    font-size: 28px;
    font-weight: 700;
    color: #0f172a;
    margin-bottom: 8px;
  }
  .subtitle {
    color: #64748b;
    font-size: 14px;
    margin-bottom: 20px;
  }
  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  input[type="search"] {
    flex: 1;
    min-width: 240px;
    padding: 10px 14px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
    outline: none;
    transition: border-color .15s;
  }
  input[type="search"]:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59,130,246,.15);
  }
  select {
    padding: 10px 14px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
    cursor: pointer;
  }
  .stats {
    padding: 10px 14px;
    background: #eff6ff;
    color: #1e40af;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
  }
  .grid {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }
  .card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    transition: all .15s;
  }
  .card:hover {
    border-color: #3b82f6;
    box-shadow: 0 4px 12px rgba(0,0,0,.06);
    transform: translateY(-1px);
  }
  .info { min-width: 0; flex: 1; }
  .nome {
    font-weight: 600;
    font-size: 14px;
    color: #0f172a;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .uf {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    color: #fff;
    background: #3b82f6;
    padding: 2px 6px;
    border-radius: 4px;
    margin-right: 6px;
  }
  .telefone {
    font-size: 13px;
    color: #475569;
    font-variant-numeric: tabular-nums;
  }
  .whatsapp {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #25d366;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-decoration: none;
    font-size: 18px;
    transition: background .15s;
    flex-shrink: 0;
  }
  .whatsapp:hover { background: #1da851; }
  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 40px;
    color: #94a3b8;
  }
  @media (max-width: 600px) {
    body { padding: 16px 12px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>

function formatarTelefone(num) {
  const n = num.replace(/^55/, "");
  if (n.length === 11) return `(${n.slice(0,2)}) ${n.slice(2,7)}-${n.slice(7)}`;
  if (n.length === 10) return `(${n.slice(0,2)}) ${n.slice(2,6)}-${n.slice(6)}`;
  return num;
}

const grid = document.getElementById("grid");
const busca = document.getElementById("busca");
const filtroUf = document.getElementById("filtroUf");
const contador = document.getElementById("contador");

const ufs = [...new Set(unidades.map(u => u[1]))].sort();
ufs.forEach(uf => {
  const opt = document.createElement("option");
  opt.value = uf;
  opt.textContent = uf;
  filtroUf.appendChild(opt);
});

function render() {
  const termo = busca.value.toLowerCase().trim();
  const uf = filtroUf.value;
  const filtradas = unidades.filter(([nome, estado]) => {
    const matchTermo = !termo || nome.toLowerCase().includes(termo) || estado.toLowerCase().includes(termo);
    const matchUf = !uf || estado === uf;
    return matchTermo && matchUf;
  });

  grid.innerHTML = "";
  contador.textContent = `${filtradas.length} ${filtradas.length === 1 ? "unidade" : "unidades"}`;

  if (filtradas.length === 0) {
    grid.innerHTML = '<div class="empty">Nenhuma unidade encontrada</div>';
    return;
